```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IotnestBD • Eid Mubarak</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(#020617,#020617,#000);
color:white;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

/* stars */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2}
to{opacity:1}
}

/* moon */

.moon{
position:absolute;
top:80px;
right:120px;
width:120px;
height:120px;
border-radius:50%;
background:#facc15;
box-shadow:0 0 40px #facc15;
}

.moon::after{
content:"";
position:absolute;
top:-10px;
left:30px;
width:120px;
height:120px;
background:#020617;
border-radius:50%;
}

/* container */

.container{
position:relative;
z-index:2;
max-width:750px;
padding:40px;
}

/* logo */

.logo{
font-size:52px;
font-weight:bold;
margin-bottom:20px;
}

.logo span:first-child{
color:#ff7a00;
}

.logo span:last-child{
color:#3b82f6;
}

/* eid text */

.eid{
font-size:48px;
color:#facc15;
margin-bottom:10px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px #facc15}
to{text-shadow:0 0 25px #facc15}
}

.msg{
font-size:18px;
opacity:0.9;
margin-bottom:25px;
}

/* countdown */

.countdown{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.box{
background:#111827;
border:1px solid #1f2937;
padding:18px;
border-radius:10px;
min-width:80px;
box-shadow:0 0 15px rgba(59,130,246,0.3);
}

.box span{
display:block;
font-size:32px;
color:#3b82f6;
}

.resume{
margin-top:20px;
font-size:16px;
opacity:0.8;
}

</style>
</head>

<body>

<!-- stars -->

<script>
for(let i=0;i<120;i++){
let star=document.createElement("div")
star.className="star"
star.style.left=Math.random()*100+"%"
star.style.top=Math.random()*100+"%"
star.style.animationDelay=Math.random()*3+"s"
document.body.appendChild(star)
}
</script>

<!-- moon -->

<div class="moon"></div>

<div class="container">

<div class="logo">
<span>Iotnest</span><span>BD</span>
</div>

<div class="eid">
🌙 Eid Mubarak
</div>

<div class="msg">
Wishing you and your family a joyful and blessed Eid.<br>
May your days be filled with happiness, peace, and success.
</div>

<div class="resume">
Our regular activities will resume on <b>24 March</b>
</div>

<br>

<div class="countdown">

<div class="box">
<span id="days">0</span>
Days
</div>

<div class="box">
<span id="hours">0</span>
Hours
</div>

<div class="box">
<span id="minutes">0</span>
Minutes
</div>

<div class="box">
<span id="seconds">0</span>
Seconds
</div>

</div>

</div>

<script>

const target = new Date("March 24, 2026 00:00:00").getTime();

setInterval(()=>{

const now = new Date().getTime();
const diff = target - now;

const d = Math.floor(diff/(1000*60*60*24));
const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const m = Math.floor((diff%(1000*60*60))/(1000*60));
const s = Math.floor((diff%(1000*60))/1000);

document.getElementById("days").innerText=d;
document.getElementById("hours").innerText=h;
document.getElementById("minutes").innerText=m;
document.getElementById("seconds").innerText=s;

},1000);

</script>

</body>
</html>
```
