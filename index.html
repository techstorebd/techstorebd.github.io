<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IotnestBD • Eid Mubarak</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#020617;
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
overflow:hidden;
}

/* stars */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:0.6;
}



/* container */

.container{
max-width:600px;
padding:30px;
z-index:2;
}

/* logo */

.logo{
font-size:40px;
font-weight:bold;
margin-bottom:10px;
}

.logo span:first-child{color:#ff7a00;}
.logo span:last-child{color:#3b82f6;}

.eid{
font-size:36px;
color:#facc15;
margin-bottom:10px;
}

.msg{
font-size:16px;
opacity:0.9;
margin-bottom:15px;
}

/* countdown */

.countdown{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.box{
background:#111827;
padding:10px;
border-radius:8px;
min-width:70px;
}

.box span{
display:block;
font-size:22px;
color:#3b82f6;
}

</style>
</head>

<body>



<div class="container">

<div class="logo">
<span>Iotnest</span><span>BD</span>
</div>

<div class="eid">
🌙 Eid Mubarak
</div>

<div class="msg">
Wishing you a joyful and blessed Eid.
</div>

<div class="msg">
Regular activities resume on <b>24 March</b>
</div>

<div class="countdown">

<div class="box"><span id="d">0</span>Days</div>
<div class="box"><span id="h">0</span>Hours</div>
<div class="box"><span id="m">0</span>Min</div>
<div class="box"><span id="s">0</span>Sec</div>

</div>

</div>

<script>

/* stars (lightweight) */

for(let i=0;i<25;i++){
let star=document.createElement("div")
star.className="star"
star.style.left=Math.random()*100+"%"
star.style.top=Math.random()*100+"%"
document.body.appendChild(star)
}

/* countdown */

const target=new Date("March 24, 2026 00:00:00").getTime()

setInterval(()=>{

const now=new Date().getTime()
const diff=target-now

d.innerText=Math.floor(diff/86400000)
h.innerText=Math.floor(diff%86400000/3600000)
m.innerText=Math.floor(diff%3600000/60000)
s.innerText=Math.floor(diff%60000/1000)

},1000)

</script>

</body>
</html>
