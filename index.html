<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IotnestBD • Eid Mubarak</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:#020617;
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
overflow:hidden;
}

/* STAR FIELD */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:0.8;
animation:twinkle 3s infinite alternate;
pointer-events:none;
z-index:0;
}

@keyframes twinkle{
from{opacity:0.2}
to{opacity:1}
}

/* MOON */

.moon{
position:absolute;
top:70px;
right:120px;
width:120px;
height:120px;
background:#facc15;
border-radius:50%;
box-shadow:0 0 40px #facc15;
}

.moon::after{
content:"";
position:absolute;
width:120px;
height:120px;
background:#020617;
border-radius:50%;
left:35px;
top:-10px;
}

/* MAIN CONTAINER */

.container{
position:relative;
z-index:5;
max-width:750px;
padding:40px;
}

/* LOGO */

.logo{
font-size:52px;
font-weight:bold;
margin-bottom:10px;
}

.logo span:first-child{color:#ff7a00;}
.logo span:last-child{color:#3b82f6;}

/* EID TITLE */

.eid{
font-size:48px;
color:#facc15;
margin-bottom:10px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px #facc15}
to{text-shadow:0 0 25px #facc15}
}

/* TEXT */

.msg{
font-size:18px;
opacity:0.9;
margin-bottom:20px;
}

.resume{
opacity:0.8;
margin-bottom:25px;
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

.box{
background:#111827;
border-radius:10px;
padding:18px;
min-width:90px;
border:1px solid #1f2937;
box-shadow:0 0 15px rgba(59,130,246,0.3);
}

.box span{
display:block;
font-size:34px;
color:#3b82f6;
}

/* MOSQUE */

.mosque{
position:absolute;
bottom:0;
width:100%;
height:160px;
background:linear-gradient(to top,#020617,transparent);
z-index:1;
}

.mosque svg{
width:100%;
height:100%;
opacity:0.5;
}

/* FIREWORK */

.firework{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:explode 1.4s ease-out infinite;
}

@keyframes explode{
0%{transform:scale(1);opacity:1}
100%{transform:scale(20);opacity:0}
}

</style>
</head>

<body>

<div class="moon"></div>

<div class="container">

<div class="logo">
<span>Iotnest</span><span>BD</span>
</div>

<div class="eid">
🌙 Eid Mubarak
</div>

<div class="msg">
Wishing you and your family a joyful and blessed Eid.<br>
May your days be filled with happiness, peace, and success.
</div>

<div class="resume">
Our regular activities will resume on <b>24 March</b>
</div>

<div class="countdown">

<div class="box">
<span id="days">0</span>
Days
</div>

<div class="box">
<span id="hours">0</span>
Hours
</div>

<div class="box">
<span id="minutes">0</span>
Minutes
</div>

<div class="box">
<span id="seconds">0</span>
Seconds
</div>

</div>

</div>

<!-- MOSQUE SKYLINE -->

<div class="mosque">
<svg viewBox="0 0 1200 200" fill="#111827">

<rect x="0" y="150" width="1200" height="50"/>

<rect x="300" y="100" width="200" height="50"/>
<polygon points="300,100 400,50 500,100"/>

<rect x="650" y="110" width="180" height="40"/>
<polygon points="650,110 740,60 830,110"/>

<rect x="550" y="80" width="100" height="70"/>
<polygon points="550,80 600,30 650,80"/>

</svg>
</div>

<!-- FIREWORKS -->

<div class="firework" style="top:20%;left:30%"></div>
<div class="firework" style="top:30%;left:70%"></div>
<div class="firework" style="top:40%;left:50%"></div>

<script>

/* STAR FIELD */

for(let i=0;i<80;i++){
let star=document.createElement("div")
star.className="star"
star.style.left=Math.random()*100+"%"
star.style.top=Math.random()*100+"%"
star.style.animationDelay=Math.random()*3+"s"
document.body.appendChild(star)
}

/* COUNTDOWN */

const target=new Date("March 24, 2026 00:00:00").getTime();

setInterval(()=>{

const now=new Date().getTime();
const diff=target-now;

const d=Math.floor(diff/(1000*60*60*24));
const h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const m=Math.floor((diff%(1000*60*60))/(1000*60));
const s=Math.floor((diff%(1000*60))/1000);

document.getElementById("days").innerText=d;
document.getElementById("hours").innerText=h;
document.getElementById("minutes").innerText=m;
document.getElementById("seconds").innerText=s;

},1000);

</script>

</body>
</html>
